name: Test

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 2026-11-08 00:33 +03: Boss 2026-11-08 00:32: test on JDK 17 and 21 only; the library still compiles for Java 8
        # (jvmTarget 1.8), as kwtsms-java does. Unblocks Gradle 9 and JUnit 6. Task q-kotlin-jdk-matrix.
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Run unit tests
        # 2026-11-05 09:09 +03: tests read the test number from this secret and skip when unset. Task: int-testnumber
        env:
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
        run: ./gradlew test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-java-${{ matrix.java }}
          path: build/reports/tests/

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run integration tests
        run: ./gradlew test
        env:
          KOTLIN_USERNAME: ${{ secrets.KOTLIN_USERNAME }}
          KOTLIN_PASSWORD: ${{ secrets.KOTLIN_PASSWORD }}
          # 2026-11-05 09:09 +03: live sends go only to this number; skipped when unset. Task: int-testnumber
          KWTSMS_TEST_NUMBER: ${{ secrets.KWTSMS_TEST_NUMBER }}
